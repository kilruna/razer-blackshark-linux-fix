app-id: com.github.kilruna.razer-blackshark-linux-fix
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: razer-blackshark-fix-gui

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: razer-blackshark-fix
    buildsystem: simple
    build-commands:
      - install -Dm755 razer-blackshark-fix /app/bin/razer-blackshark-fix
      - install -Dm755 gui/razer-blackshark-fix-gui.py /app/bin/razer-blackshark-fix-gui
      - install -Dm644 flatpak/com.github.kilruna.razer-blackshark-linux-fix.desktop /app/share/applications/com.github.kilruna.razer-blackshark-linux-fix.desktop
      - install -Dm644 flatpak/com.github.kilruna.razer-blackshark-linux-fix.metainfo.xml /app/share/metainfo/com.github.kilruna.razer-blackshark-linux-fix.metainfo.xml
      - install -Dm644 flatpak/icons/com.github.kilruna.razer-blackshark-linux-fix.svg /app/share/icons/hicolor/scalable/apps/com.github.kilruna.razer-blackshark-linux-fix.svg
    sources:
      - type: dir
        path: .
